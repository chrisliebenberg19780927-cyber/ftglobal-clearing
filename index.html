<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Trade Global · Clearing Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1a2540;--navy2:#253050;--gold:#b8962e;--gold-lt:#fdf6e3;
    --off:#f4f6fa;--border:#dde2ee;--text:#1a2540;--text2:#5a6680;--text3:#9aa0b4;
    --white:#ffffff;--green:#1a7a3a;--green2:#27ae60;--green-lt:#eaf7ee;
    --amber:#d4820a;--amber-lt:#fef5e7;--red:#c0392b;--red-lt:#fdf0ef;
    --shadow:0 1px 3px rgba(26,37,64,0.07),0 4px 16px rgba(26,37,64,0.07);
    --mono:'DM Mono',monospace;--head:'Playfair Display',serif;--body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--off);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh;}
  .header{background:var(--navy);padding:0 24px;position:relative;overflow:hidden;}
  .header::before{content:'';position:absolute;top:0;right:0;width:300px;height:100%;background:radial-gradient(circle at top right,rgba(212,175,55,.12) 0%,transparent 60%);}
  .header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1a6b3a,#d4af37,#b52a1c);opacity:.7;}
  .header-inner{max-width:780px;margin:0 auto;padding:28px 0 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;position:relative;z-index:1;}
  .header-company{font-family:var(--head);font-size:20px;font-weight:700;color:#fff;}
  .header-doc{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,55,.8);margin-top:2px;}
  .header-meta{text-align:right;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45);line-height:1.8;}
  .header-meta strong{color:rgba(255,255,255,.75);display:block;font-size:12px;margin-bottom:2px;}
  .notice{background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.04));border-bottom:1px solid rgba(212,175,55,.2);padding:10px 24px;font-size:12px;color:var(--text2);text-align:center;}
  .content{max-width:780px;margin:0 auto;padding:24px;}
  .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .summary-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .summary-val{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--navy);line-height:1;margin-bottom:5px;}
  .summary-val.gold{color:var(--gold);}.summary-val.red{color:var(--red);}
  .summary-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);}
  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border);}
  .card-title{font-family:var(--head);font-size:17px;font-weight:700;color:var(--navy);}
  .card-count{font-family:var(--mono);font-size:11px;color:var(--text3);}
  .po-group{border-bottom:1px solid var(--border);}
  .po-group:last-child{border-bottom:none;}
  .po-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 20px;cursor:pointer;transition:background .12s;}
  .po-header:hover{background:var(--off);}
  .po-left{flex:1;min-width:0;}
  .po-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
  .po-badge{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--gold);background:var(--gold-lt);border:1px solid rgba(184,150,46,.25);border-radius:5px;padding:3px 8px;white-space:nowrap;}
  .po-lines{font-size:11px;font-weight:600;color:var(--text2);}
  .po-supplier{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px;}
  .po-eta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .po-eta{font-family:var(--mono);font-size:11px;color:var(--text2);}
  .po-days{font-family:var(--mono);font-size:11px;font-weight:600;}
  .po-days.overdue{color:var(--red);}.po-days.today{color:var(--amber);}.po-days.soon{color:var(--green2);}.po-days.later{color:var(--text2);}
  .po-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .po-value{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--navy);}
  .po-qty{font-size:10px;color:var(--text3);}
  .po-expand{font-size:10px;color:var(--text3);margin-top:2px;}
  .po-products{display:none;background:var(--off);border-top:1px solid var(--border);padding:0 20px 8px;}
  .po-products.open{display:block;}
  .products-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 0 6px;}
  .product-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .product-line:last-child{border-bottom:none;}
  .pl-left{flex:1;min-width:0;}
  .pl-name{font-size:12px;font-weight:500;color:var(--navy);line-height:1.3;}
  .pl-meta{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap;}
  .pl-code{font-family:var(--mono);font-size:10px;color:var(--gold);background:var(--gold-lt);border:1px solid rgba(184,150,46,.2);border-radius:4px;padding:1px 6px;}
  .pl-eta{font-size:10px;color:var(--text3);}
  .pl-right{text-align:right;flex-shrink:0;}
  .pl-value{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--navy);}
  .pl-qty{font-size:10px;color:var(--text3);}
  .pill{font-size:10px;font-weight:600;border-radius:100px;padding:3px 9px;white-space:nowrap;display:inline-block;}
  .pill-green{background:var(--green-lt);color:var(--green);border:1px solid rgba(26,107,58,.2);}
  .pill-amber{background:var(--amber-lt);color:var(--amber);border:1px solid rgba(212,130,10,.2);}
  .pill-red{background:var(--red-lt);color:var(--red);border:1px solid rgba(181,42,28,.2);}
  .loading-state{display:flex;align-items:center;justify-content:center;gap:14px;padding:60px 0;color:var(--text2);font-size:13px;}
  .loader{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px;}
  .footer{max-width:780px;margin:0 auto;padding:0 24px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .footer-note{font-size:11px;color:var(--text3);line-height:1.6;}
  .btn-refresh{background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:var(--body);font-size:12px;font-weight:600;padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn-refresh:hover{background:var(--navy2);}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeIn .35s ease;}
  @media print{body{background:#fff;}.notice,.btn-refresh,.footer-note,.po-expand{display:none;}.po-products{display:block!important;}.card,.summary-box{box-shadow:none;border-color:#ccc;}.header{print-color-adjust:exact;-webkit-print-color-adjust:exact;}}
  @media(max-width:600px){.summary-row{grid-template-columns:repeat(2,1fr);}.header-inner{flex-direction:column;gap:12px;}.header-meta{text-align:left;}.content{padding:16px;}.footer{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-company">First Trade Global Pty Ltd</div>
      <div class="header-doc">Open Purchase Orders — Clearing Agent Report</div>
    </div>
    <div class="header-meta" id="headerMeta"><strong>Loading…</strong></div>
  </div>
</div>
<div class="notice">Live data · Refreshed from purchasing system · For customs &amp; clearing purposes only</div>
<div class="content">
  <div class="summary-row">
    <div class="summary-box"><div class="summary-val" id="sumPos">—</div><div class="summary-lbl">Open POs</div></div>
    <div class="summary-box"><div class="summary-val gold" id="sumValue">—</div><div class="summary-lbl">Total Order Value</div></div>
    <div class="summary-box"><div class="summary-val red" id="sumOverdue">—</div><div class="summary-lbl">Overdue</div></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">Purchase Orders — Awaiting Arrival</div>
      <div class="card-count" id="poCount"></div>
    </div>
    <div id="tableWrap"><div class="loading-state"><div class="loader"></div>Loading purchase orders…</div></div>
  </div>
</div>
<div class="footer">
  <div class="footer-note" id="footerNote"></div>
  <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
</div>
<script>
const SHEET_ID='2PACX-1vTM3RGvAzvyfYXO0XMYHD2AqHl9tY32mEPXEkqDZwVNeArhVNnLp2du0YF-2WpN9SPqT21B3Q0455xJ';
const PO_URL=`https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=1996828404&single=true&output=csv`;
function parseCSV(txt){
  const rows=[];const lines=txt.split('\n');
  for(let i=1;i<lines.length;i++){
    const line=lines[i].trim();if(!line)continue;
    const cols=[];let cur='',inQ=false;
    for(let c=0;c<line.length;c++){
      if(line[c]==='"'){inQ=!inQ;}
      else if(line[c]===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=line[c];}
    }
    cols.push(cur.trim());rows.push(cols);
  }
  return rows;
}
function extractName(raw){
  if(!raw)return'';
  const s=raw.toString().trim().replace(/^[\[(]/,'').replace(/[\])]/,'');
  const idx=s.indexOf(',');
  if(idx===-1)return s.trim();
  return s.slice(idx+1).trim().replace(/^['"]/,'').replace(/['"]$/,'').trim()||s.trim();
}
function parseMoney(s){return parseFloat((s||'').replace(/[^0-9.-]/g,''))||0;}
function parseNum(s){return parseFloat((s||'').replace(/[^0-9.-]/g,''))||0;}
function parseDate(s){
  if(!s||s==='FALSE'||s==='false'||s==='0')return null;
  s=s.toString().trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){const p=s.split('/');return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));}
  return null;
}
function fmtDate(d){if(!d)return'ETA unknown';return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}
function fmtNum(n){
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}
function togglePO(uid){
  const el=document.getElementById(uid);if(!el)return;
  el.classList.toggle('open');
  const arrow=document.getElementById('arrow_'+uid);
  if(arrow)arrow.textContent=el.classList.contains('open')?'▴ tap to close':'▾ tap to expand';
}
async function loadData(){
  document.getElementById('tableWrap').innerHTML='<div class="loading-state"><div class="loader"></div>Loading purchase orders…</div>';
  ['sumPos','sumValue','sumOverdue'].forEach(id=>document.getElementById(id).textContent='—');
  document.getElementById('poCount').textContent='';
  document.getElementById('footerNote').textContent='';
  document.getElementById('headerMeta').innerHTML='<strong>Loading…</strong>';
  try{
    const resp=await fetch(PO_URL+'&t='+Date.now());
    const text=await resp.text();
    const rows=parseCSV(text);
    const lines=rows
      .filter(r=>r[0]&&parseNum(r[4])>0)
      .map(r=>{
        const poId=extractName(r[9])||(r[0]||'').toString().trim();
        const supplier=extractName(r[1]);
        const rawD=(r[3]||'').toString().trim();
        const cm=rawD.match(/^\[([^\]]+)\]\s*(.*)/);
        const code=cm?cm[1]:(r[2]||'').toString().trim();
        const productName=cm?cm[2].trim():rawD;
        const qtyOrdered=parseNum(r[4]);
        const qtyReceived=parseNum(r[5]);
        const qtyOutstanding=Math.max(0,qtyOrdered-qtyReceived);
        const subtotal=parseMoney(r[6]);
        const eta=parseDate((r[7]||'').toString().trim());
        const daysToEta=eta?Math.round((eta-new Date())/86400000):null;
        const lineValue=qtyOrdered>0?(qtyOutstanding/qtyOrdered)*subtotal:0;
        return{poId,supplier,productName,code,qtyOutstanding,lineValue,eta,daysToEta};
      })
      .filter(l=>l.qtyOutstanding>0);
    const groupMap={};
    lines.forEach(l=>{if(!groupMap[l.poId])groupMap[l.poId]=[];groupMap[l.poId].push(l);});
    const groups=Object.entries(groupMap).sort(([,a],[,b])=>{
      const ea=Math.min(...a.map(l=>l.daysToEta??9999));
      const eb=Math.min(...b.map(l=>l.daysToEta??9999));
      return ea-eb;
    });
    render(groups,lines.length);
  }catch(e){
    document.getElementById('tableWrap').innerHTML=`<div class="empty-state">⚠️ Could not load data.<br><small>${e.message}</small></div>`;
  }
}
function render(groups,totalLines){
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const timeStr=now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('headerMeta').innerHTML=`<strong>Generated ${dateStr}</strong>at ${timeStr}`;
  document.getElementById('footerNote').innerHTML=`Data sourced live from purchasing system.<br>Generated ${dateStr} at ${timeStr}.`;
  const totalVal=groups.reduce((s,[,ls])=>s+ls.reduce((a,l)=>a+l.lineValue,0),0);
  const overdueCount=groups.filter(([,ls])=>ls.some(l=>l.daysToEta!==null&&l.daysToEta<0)).length;
  document.getElementById('sumPos').textContent=groups.length;
  document.getElementById('sumValue').textContent=fmtNum(totalVal);
  document.getElementById('sumOverdue').textContent=overdueCount;
  document.getElementById('poCount').textContent=`${groups.length} PO${groups.length!==1?'s':''} · ${totalLines} lines`;
  if(groups.length===0){document.getElementById('tableWrap').innerHTML='<div class="empty-state">No open purchase orders found.</div>';return;}
  const html=groups.map(([poId,ls])=>{
    const first=ls[0];
    const totalV=ls.reduce((s,l)=>s+l.lineValue,0);
    const totalQ=ls.reduce((s,l)=>s+l.qtyOutstanding,0);
    const minDays=ls.reduce((m,l)=>l.daysToEta!==null?Math.min(m,l.daysToEta):m,9999);
    const daysToEta=minDays===9999?null:minDays;
    const etaLine=ls.find(l=>l.daysToEta===daysToEta)||first;
    const etaStr=fmtDate(etaLine.eta);
    let daysClass='later',daysLabel='—';
    if(daysToEta!==null){
      if(daysToEta<0){daysClass='overdue';daysLabel=Math.abs(daysToEta)+'d OVERDUE';}
      else if(daysToEta===0){daysClass='today';daysLabel='Due today';}
      else if(daysToEta<=21){daysClass='soon';daysLabel=daysToEta+'d to arrival';}
      else{daysClass='later';daysLabel=daysToEta+'d to arrival';}
    }
    const pill=daysToEta===null?'<span class="pill pill-amber">No ETA</span>':daysToEta<0?'<span class="pill pill-red">Overdue</span>':daysToEta<=14?'<span class="pill pill-green">Arriving soon</span>':'<span class="pill pill-amber">Pending</span>';
    const uid='po_'+poId.replace(/[^a-zA-Z0-9]/g,'_');
    const productLines=ls.map(l=>`
      <div class="product-line">
        <div class="pl-left">
          <div class="pl-name">${l.productName||'—'}</div>
          <div class="pl-meta">
            ${l.code?`<span class="pl-code">${l.code}</span>`:''}
            <span class="pl-eta">📅 ${fmtDate(l.eta)}</span>
          </div>
        </div>
        <div class="pl-right">
          <div class="pl-value">${fmtNum(l.lineValue)}</div>
          <div class="pl-qty">${Math.round(l.qtyOutstanding).toLocaleString()} cases</div>
        </div>
      </div>`).join('');
    return`<div class="po-group">
      <div class="po-header" onclick="togglePO('${uid}')">
        <div class="po-left">
          <div class="po-top-row"><span class="po-badge">${poId}</span><span class="po-lines">${ls.length} line${ls.length!==1?'s':''}</span>${pill}</div>
          <div class="po-supplier">${first.supplier||'—'}</div>
          <div class="po-eta-row"><span class="po-eta">📅 ${etaStr}</span><span class="po-days ${daysClass}">${daysLabel}</span></div>
        </div>
        <div class="po-right">
          <div class="po-value">${fmtNum(totalV)}</div>
          <div class="po-qty">${Math.round(totalQ).toLocaleString()} cases</div>
          <div class="po-expand" id="arrow_${uid}">▾ tap to expand</div>
        </div>
      </div>
      <div class="po-products" id="${uid}">
        <div class="products-label">Products on this PO</div>
        ${productLines}
      </div>
    </div>`;
  }).join('');
  document.getElementById('tableWrap').innerHTML=`<div class="fade-in">${html}</div>`;
}
loadData();
</script>
</body>
</html>
