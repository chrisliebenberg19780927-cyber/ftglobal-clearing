<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Trade Global · Clearing Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:     #1a2540;
    --navy2:    #253050;
    --navy3:    #0f1828;
    --gold:     #b8962e;
    --gold2:    #d4af37;
    --gold-lt:  #fdf6e3;
    --off:      #f4f6fa;
    --border:   #dde2ee;
    --border2:  #c4ccdf;
    --text:     #1a2540;
    --text2:    #5a6680;
    --text3:    #9aa0b4;
    --white:    #ffffff;
    --green:    #1a7a3a;
    --green2:   #27ae60;
    --green-lt: #eaf7ee;
    --amber:    #d4820a;
    --amber-lt: #fef5e7;
    --red:      #c0392b;
    --red-lt:   #fdf0ef;
    --shadow:   0 1px 3px rgba(26,37,64,0.07), 0 4px 16px rgba(26,37,64,0.07);
    --mono: 'DM Mono', monospace;
    --head: 'Playfair Display', serif;
    --body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--off);
    color: var(--text);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    padding: 0 24px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 300px; height: 100%;
    background: radial-gradient(circle at top right, rgba(212,175,55,0.12) 0%, transparent 60%);
  }
  .header::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #1a6b3a, #d4af37, #b52a1c);
    opacity: 0.7;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 0 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    position: relative; z-index: 1;
  }
  .header-brand { display: flex; align-items: center; gap: 16px; }
  .header-logo {
    height: 52px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }
  .header-title { line-height: 1.15; }
  .header-company {
    font-family: var(--head);
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.01em;
  }
  .header-doc {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(212,175,55,0.8);
    margin-top: 2px;
  }
  .header-meta {
    text-align: right;
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    line-height: 1.8;
  }
  .header-meta strong {
    color: rgba(255,255,255,0.75);
    display: block;
    font-size: 12px;
    margin-bottom: 2px;
  }

  /* ── NOTICE BANNER ── */
  .notice {
    background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(212,175,55,0.04));
    border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 10px 24px;
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    letter-spacing: 0.03em;
  }

  /* ── CONTENT ── */
  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ── SUMMARY ROW ── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .summary-val {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--navy);
    line-height: 1;
    margin-bottom: 5px;
  }
  .summary-val.gold { color: var(--gold); }
  .summary-val.red  { color: var(--red); }
  .summary-lbl {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
  }

  /* ── TABLE ── */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    font-family: var(--head);
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
  }
  .card-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 10px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  thead th.right { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--off); }
  tbody td {
    padding: 13px 10px;
    vertical-align: middle;
  }

  .po-number {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
    background: var(--gold-lt);
    border: 1px solid rgba(184,150,46,0.25);
    border-radius: 5px;
    padding: 3px 8px;
    display: inline-block;
    white-space: nowrap;
  }
  .supplier-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
  }
  .product-name {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .product-code {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gold);
    background: var(--gold-lt);
    border: 1px solid rgba(184,150,46,0.2);
    border-radius: 4px;
    padding: 2px 6px;
    display: inline-block;
    margin-top: 2px;
  }

  .eta-date {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--navy);
  }
  .eta-days {
    font-size: 11px;
    margin-top: 2px;
    font-weight: 600;
  }
  .eta-days.overdue { color: var(--red); }
  .eta-days.today   { color: var(--amber); }
  .eta-days.soon    { color: var(--green2); }
  .eta-days.later   { color: var(--text2); }

  .qty-val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    text-align: right;
  }
  .qty-unit {
    font-size: 10px;
    color: var(--text3);
    text-align: right;
  }

  .value-val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    text-align: right;
  }

  /* status pill */
  .status-pill {
    font-size: 10px;
    font-weight: 600;
    border-radius: 100px;
    padding: 3px 9px;
    white-space: nowrap;
    display: inline-block;
  }
  .pill-green  { background: var(--green-lt); color: var(--green); border: 1px solid rgba(26,107,58,0.2); }
  .pill-amber  { background: var(--amber-lt); color: var(--amber); border: 1px solid rgba(212,130,10,0.2); }
  .pill-red    { background: var(--red-lt);   color: var(--red);   border: 1px solid rgba(181,42,28,0.2); }

  /* ── LOADING / EMPTY ── */
  .loading-state {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; padding: 60px 0;
    color: var(--text2); font-size: 13px;
  }
  .loader {
    width: 22px; height: 22px;
    border: 2px solid var(--border2);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text3); font-size: 13px;
  }

  /* ── FOOTER ── */
  .footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .footer-note {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.6;
  }
  .btn-refresh {
    background: var(--navy);
    color: #fff; border: none;
    border-radius: 8px;
    font-family: var(--body); font-size: 12px; font-weight: 600;
    padding: 9px 18px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn-refresh:hover { background: var(--navy2); }
  .btn-refresh:active { transform: scale(0.97); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.35s ease; }

  /* ── PRINT ── */
  @media print {
    body { background: #fff; }
    .notice, .btn-refresh, .footer-note { display: none; }
    .card, .summary-box { box-shadow: none; border-color: #ccc; }
    .header { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }

  @media (max-width: 600px) {
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .header-inner { flex-direction: column; gap: 12px; }
    .header-meta { text-align: left; }
    table { font-size: 12px; }
    .header-logo { height: 40px; }
    .content { padding: 16px; }
    .footer { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">
        <div class="header-company">First Trade Global Pty Ltd</div>
        <div class="header-doc">Open Purchase Orders — Clearing Agent Report</div>
      </div>
    </div>
    <div class="header-meta" id="headerMeta">
      <strong>Loading…</strong>
    </div>
  </div>
</div>

<!-- ═══ NOTICE ═══ -->
<div class="notice">
  Live data · Automatically refreshed from purchasing system · For customs & clearing purposes only
</div>

<!-- ═══ CONTENT ═══ -->
<div class="content">

  <!-- SUMMARY -->
  <div class="summary-row" id="summaryRow">
    <div class="summary-box">
      <div class="summary-val" id="sumTotal">—</div>
      <div class="summary-lbl">Open POs</div>
    </div>
    <div class="summary-box">
      <div class="summary-val gold" id="sumValue">—</div>
      <div class="summary-lbl">Total Order Value</div>
    </div>
    <div class="summary-box">
      <div class="summary-val red" id="sumOverdue">—</div>
      <div class="summary-lbl">Overdue</div>
    </div>
  </div>

  <!-- PO TABLE -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Purchase Orders — Awaiting Arrival</div>
      <div class="card-count" id="poCount"></div>
    </div>
    <div id="tableWrap">
      <div class="loading-state">
        <div class="loader"></div>
        Loading purchase orders…
      </div>
    </div>
  </div>

</div>

<!-- ═══ FOOTER ═══ -->
<div class="footer">
  <div class="footer-note" id="footerNote"></div>
  <button class="btn-refresh" onclick="loadData()">
    ↻ Refresh
  </button>
</div>

<script>
// ═══ CONFIG — same sheet as the sales app ═══
const SHEET_ID = '2PACX-1vTM3RGvAzvyfYXO0XMYHD2AqHl9tY32mEPXEkqDZwVNeArhVNnLp2du0YF-2WpN9SPqT21B3Q0455xJ';
const PO_URL   = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=1996828404&single=true&output=csv`;

// ═══ HELPERS ═══
function parseCSV(txt) {
  const rows = [], lines = txt.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim(); if (!line) continue;
    const cols = []; let cur = '', inQ = false;
    for (let c = 0; c < line.length; c++) {
      if (line[c] === '"') { inQ = !inQ; }
      else if (line[c] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += line[c]; }
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function parseMoney(s) { return parseFloat((s || '').replace(/[^0-9.-]/g, '')) || 0; }
function parseNum(s)   { return parseFloat((s || '').replace(/[^0-9.-]/g, '')) || 0; }

function parseDate(s) {
  if (!s) return null;
  s = s.toString().trim();
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) {
    const p = s.split('/');
    return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  }
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  return null;
}

function fmtDate(d) {
  if (!d) return 'ETA unknown';
  return d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtR(n) {
  if (n >= 1e6) return 'R ' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return 'R ' + (n / 1e3).toFixed(1) + 'K';
  return 'R ' + Math.round(n).toLocaleString();
}

function extractName(raw) {
  const m = (raw || '').toString().trim().match(/^\d+,\s*(.+)$/);
  return m ? m[1].trim() : (raw || '').toString().trim();
}

function extractCode(productName) {
  const m = (productName || '').match(/\[([^\]]+)\]/);
  return m ? m[1] : '';
}

function cleanProductName(raw) {
  return raw.replace(/^\d+,\s*/, '').replace(/\[[^\]]+\]\s*/, '').trim() || raw;
}

// ═══ LOAD ═══
async function loadData() {
  // Reset to loading
  document.getElementById('tableWrap').innerHTML =
    '<div class="loading-state"><div class="loader"></div>Loading purchase orders…</div>';
  document.getElementById('sumTotal').textContent   = '—';
  document.getElementById('sumValue').textContent   = '—';
  document.getElementById('sumOverdue').textContent = '—';
  document.getElementById('poCount').textContent    = '';
  document.getElementById('footerNote').textContent = '';
  document.getElementById('headerMeta').innerHTML   = '<strong>Loading…</strong>';

  try {
    const resp = await fetch(PO_URL + '&t=' + Date.now());
    const text = await resp.text();
    const rows = parseCSV(text);

    // PO tab: A=PO Odoo ID, B=Supplier, C=ProductOdooID(dup), D=Product, E=QtyOrdered, F=QtyReceived, G=Subtotal, H=DatePlanned
    const poRows = rows
      .filter(r => r[0] && parseNum(r[4]) > 0)
      .map(r => {
        const rawA = (r[0] || '').toString().trim();
        const rawB = (r[1] || '').toString().trim();
        const rawD = (r[3] || '').toString().trim();

        const poId     = extractName(rawA);
        const supplier = extractName(rawB);
        const productRaw = extractName(rawD);
        const productName = cleanProductName(productRaw);
        const code     = extractCode(productRaw);

        const qtyOrdered     = parseNum(r[4]);
        const qtyReceived    = parseNum(r[5]);
        const qtyOutstanding = Math.max(0, qtyOrdered - qtyReceived);
        const subtotal       = parseMoney(r[6]);
        const datePlanned    = (r[7] || '').toString().trim();
        const outstandingVal = qtyOrdered > 0 ? (qtyOutstanding / qtyOrdered) * subtotal : 0;
        const eta            = datePlanned ? parseDate(datePlanned) : null;
        const daysToEta      = eta ? Math.round((eta - new Date()) / 86400000) : null;

        return {
          poId, supplier, productName, code,
          qtyOrdered, qtyReceived, qtyOutstanding,
          totalValue: outstandingVal,
          eta, daysToEta,
          etaStr: fmtDate(eta)
        };
      })
      .filter(l => l.qtyOutstanding > 0)
      .sort((a, b) => (a.daysToEta ?? 9999) - (b.daysToEta ?? 9999));

    renderTable(poRows);

  } catch (e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="empty-state">⚠️ Could not load data.<br><small>${e.message}</small></div>`;
    console.error(e);
  }
}

function renderTable(rows) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });

  document.getElementById('headerMeta').innerHTML =
    `<strong>Generated ${dateStr}</strong>at ${timeStr}`;

  const totalValue = rows.reduce((s, r) => s + r.totalValue, 0);
  const overdueCount = rows.filter(r => r.daysToEta !== null && r.daysToEta < 0).length;

  document.getElementById('sumTotal').textContent   = rows.length;
  document.getElementById('sumValue').textContent   = fmtR(totalValue);
  document.getElementById('sumOverdue').textContent = overdueCount;
  document.getElementById('poCount').textContent    = rows.length + ' lines';
  document.getElementById('footerNote').innerHTML =
    `Data sourced live from purchasing system.<br>Generated ${dateStr} at ${timeStr}.`;

  if (rows.length === 0) {
    document.getElementById('tableWrap').innerHTML =
      '<div class="empty-state">No open purchase orders found.</div>';
    return;
  }

  const tbody = rows.map(r => {
    // ETA styling
    let daysLabel = '—', daysClass = '';
    if (r.daysToEta !== null) {
      if (r.daysToEta < 0) {
        daysLabel = Math.abs(r.daysToEta) + 'd OVERDUE';
        daysClass = 'overdue';
      } else if (r.daysToEta === 0) {
        daysLabel = 'Due today';
        daysClass = 'today';
      } else if (r.daysToEta <= 21) {
        daysLabel = r.daysToEta + 'd to arrival';
        daysClass = 'soon';
      } else {
        daysLabel = r.daysToEta + 'd to arrival';
        daysClass = 'later';
      }
    }

    // Status pill
    let pill = '';
    if (r.daysToEta === null) {
      pill = '<span class="status-pill pill-amber">No ETA</span>';
    } else if (r.daysToEta < 0) {
      pill = '<span class="status-pill pill-red">Overdue</span>';
    } else if (r.daysToEta <= 14) {
      pill = '<span class="status-pill pill-green">Arriving soon</span>';
    } else {
      pill = '<span class="status-pill pill-amber">Pending</span>';
    }

    return `<tr>
      <td>
        <span class="po-number">PO-${r.poId}</span>
      </td>
      <td>
        <div class="supplier-name">${r.supplier || '—'}</div>
      </td>
      <td>
        <div class="product-name">${r.productName || '—'}</div>
        ${r.code ? `<div class="product-code">${r.code}</div>` : ''}
      </td>
      <td style="text-align:right">
        <div class="qty-val">${Math.round(r.qtyOutstanding).toLocaleString()}</div>
        <div class="qty-unit">cases</div>
      </td>
      <td>
        <div class="eta-date">${r.etaStr}</div>
        <div class="eta-days ${daysClass}">${daysLabel}</div>
      </td>
      <td style="text-align:right">
        ${pill}
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <div class="fade-in">
      <table>
        <thead>
          <tr>
            <th>PO Number</th>
            <th>Supplier</th>
            <th>Product</th>
            <th class="right">Qty Outstanding</th>
            <th>ETA</th>
            <th class="right">Status</th>
          </tr>
        </thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;
}

// Auto-load on open
loadData();
</script>
</body>
</html>
